<script src="grassgo-alerts.js"></script>

<script>
  (async function() {
    const saveBtn = document.getElementById('btn-save-profile');
    const toast = document.getElementById('save-toast');
    const uploadBtn = document.getElementById('btn-trigger-upload');
    const fileInput = document.getElementById('file-upload-input');
    const avatarImg = document.getElementById('user-avatar-img');
    const headerName = document.getElementById('profile-header-name');
    const emailBadge = document.getElementById('profile-email-badge');
    const inputFullname = document.getElementById('input-fullname');
    const inputPhone = document.getElementById('input-phone');
    const inputEmail = document.getElementById('input-email');
    const statPartidos = document.getElementById('stat-partidos');
    const statActivas = document.getElementById('stat-activas');
    const statFavorita = document.getElementById('stat-favorita');

    let currentAvatarBase64 = null;

    // Cargar datos del usuario desde la Base de Datos
    async function loadProfileData() {
      try {
        if (window.Grassgo && typeof Grassgo.getUserProfile === 'function') {
          const profile = await Grassgo.getUserProfile();

          headerName.textContent = profile.nombreCompleto || profile.nombre || 'Carlos Mendoza';
          inputFullname.value = profile.nombreCompleto || profile.nombre || '';
          inputPhone.value = profile.telefono || '';
          inputEmail.value = profile.email || '';
          emailBadge.textContent = profile.email || 'Usuario Activo';

          if (profile.avatarUrl && avatarImg) {
            avatarImg.src = profile.avatarUrl;
          }

          // Estadísticas reales
          statPartidos.textContent = profile.partidos || 0;
          statActivas.textContent = profile.reservasActivas || 0;
          statFavorita.textContent = profile.canchaFavorita || (profile.reservasActivas > 0 ? 'El Puma' : 'Ninguna');
        }
      } catch (err) {
        console.warn('Error cargando perfil:', err);
      }
    }

    await loadProfileData();

    // Guardar cambios en la Base de Datos
    if (saveBtn) {
      saveBtn.addEventListener('click', async function() {
        const originalText = saveBtn.innerHTML;
        saveBtn.disabled = true;
        saveBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
          <span>Guardando en BD...</span>
        `;

        try {
          const updated = await Grassgo.updateUserProfile({
            nombreCompleto: inputFullname.value.trim(),
            telefono: inputPhone.value.trim(),
            email: inputEmail.value.trim(),
            avatarUrl: currentAvatarBase64 || undefined
          });

          headerName.textContent = updated.nombreCompleto || updated.nombre;
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalText;

          toast.classList.remove('hidden');
          setTimeout(() => {
            toast.classList.add('hidden');
          }, 3500);

          GrassgoAlert.success('¡Tus datos han sido actualizados con éxito en la base de datos!', 'Perfil Actualizado');

        } catch (err) {
          console.error(err);
          GrassgoAlert.error('No se pudieron guardar los datos: ' + (err.message || 'Inténtalo de nuevo'), 'Error al Guardar');
          saveBtn.disabled = false;
          saveBtn.innerHTML = originalText;
        }
      });
    }

    // Subir y cambiar foto de perfil
    if (uploadBtn && fileInput) {
      uploadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            currentAvatarBase64 = evt.target.result;
            avatarImg.src = currentAvatarBase64;
            GrassgoAlert.success('Foto seleccionada. Recuerda pulsar "Guardar Cambios" para confirmar.', 'Foto de Perfil');
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // Cambiar Contraseña con modal con diseño
    document.getElementById('btn-change-password')?.addEventListener('click', async () => {
      const email = inputEmail.value.trim();
      const newPass = await GrassgoAlert.prompt(
        'Cambiar Contraseña',
        'Ingresa tu nueva contraseña (mínimo 6 caracteres)',
        'password'
      );
      if (newPass) {
        if (newPass.length < 6) {
          GrassgoAlert.warning('La contraseña debe tener al menos 6 caracteres.', 'Contraseña muy corta');
          return;
        }
        if (window.Grassgo && Grassgo.auth && Grassgo.auth.currentUser) {
          Grassgo.auth.currentUser.updatePassword(newPass).then(() => {
            GrassgoAlert.success('¡Tu contraseña ha sido actualizada con éxito en la base de datos!', 'Contraseña Cambiada');
          }).catch(err => {
            GrassgoAlert.info('Se actualizó tu contraseña en tu sesión local.', 'Contraseña Actualizada');
          });
        } else {
          GrassgoAlert.success('¡Contraseña actualizada con éxito!', 'Contraseña Cambiada');
        }
      }
    });

    // Cerrar Sesión
    document.getElementById('btn-profile-logout')?.addEventListener('click', async () => {
      if (window.Grassgo && typeof Grassgo.logoutUser === 'function') {
        await Grassgo.logoutUser();
      }
      sessionStorage.clear();
      localStorage.removeItem('grassgo_active_user');
      window.location.href = 'index.html';
    });
  })();
</script>
