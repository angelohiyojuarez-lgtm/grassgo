<script data-purpose="password-visibility-toggle">
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        
        // Update SVG icon representation
        if (isPassword) {
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
          `;
        } else {
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          `;
        }
      });
    }
  </script>

<!-- BEGIN: GRASSGO Database Authentication -->
<script>
  // Funcionalidad del botón "Ingresar a la Cancha" con Base de Datos
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const submitBtn = this.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    if (!email || !password) {
      GrassgoAlert.warning('Por favor completa tu correo y contraseña para ingresar a la cancha.', 'Campos Requeridos');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>Iniciando sesión...</span>`;

    try {
      // Iniciar sesión con Firebase Auth y consultar datos en Firestore
      const user = await Grassgo.loginUser(email, password);

      // Redirige a canchas.html
      const targetUrl = window.location.pathname.endsWith('.html')
        ? window.location.pathname.replace(/[^/]+$/, 'canchas.html')
        : 'canchas.html';
      window.location.href = targetUrl;
    } catch (err) {
      console.error(err);
      GrassgoAlert.error(err.message || 'Error al iniciar sesión. Verifica tu correo y contraseña.', 'Inicio de Sesión');
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalText;
    }
  });

  // Funcionalidad del enlace "Regístrate aquí"
  document.getElementById('registerLink').addEventListener('click', function(e) {
    e.preventDefault();
    const targetUrl = window.location.pathname.endsWith('.html')
      ? window.location.pathname.replace(/[^/]+$/, 'registro.html')
      : 'registro.html';
    window.location.href = targetUrl;
  });

  // Funcionalidad del enlace "¿Olvidaste tu contraseña?"
  document.querySelector('a[href="#"]:has(> *), a[href="#"]')?.addEventListener('click', async function(e) {
    if (this.textContent.includes('Olvidaste')) {
      e.preventDefault();
      const mail = await GrassgoAlert.prompt('Recuperar Contraseña', 'tu@correo.com', 'email');
      if (mail) {
        GrassgoAlert.success(`Si ${mail} está registrado, recibirás un enlace de restablecimiento.`, 'Correo Enviado');
      }
    }
  });
</script>
