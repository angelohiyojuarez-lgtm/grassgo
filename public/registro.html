<script>
  // Simple password toggle logic for registration form
  (function() {
    const regToggle = document.getElementById('toggleRegPassword');
    const regInput = document.getElementById('regPassword');
    const regIcon = document.getElementById('regEyeIcon');

    if (regToggle && regInput && regIcon) {
      regToggle.addEventListener('click', function() {
        const isPassword = regInput.getAttribute('type') === 'password';
        regInput.setAttribute('type', isPassword ? 'text' : 'password');
        regIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();

<!-- Firebase compat + Grassgo services -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-grassgo.js"></script>
<script src="grassgo-alerts.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('registerForm');
    if (!form) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const nombre = (document.getElementById('fullName')?.value || '').trim();
      const phoneRaw = (document.getElementById('phone')?.value || '').trim();
      const email = (document.getElementById('email')?.value || '').trim();
      const password = (document.getElementById('regPassword')?.value || '');
      const terms = document.getElementById('terms');
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalHtml = submitBtn ? submitBtn.innerHTML : '';

      if (!nombre || !phoneRaw || !email || !password) {
        (window.GrassgoAlert || window.alert).warning
          ? GrassgoAlert.warning('Por favor completa todos los campos requeridos.', 'Campos Requeridos')
          : alert('Por favor completa todos los campos requeridos.');
        return;
      }
      if (password.length < 6) {
        (window.GrassgoAlert ? GrassgoAlert.warning('La contraseña debe tener al menos 6 caracteres.', 'Contraseña') : alert('La contraseña debe tener al menos 6 caracteres.'));
        return;
      }
      if (!terms || !terms.checked) {
        (window.GrassgoAlert ? GrassgoAlert.warning('Debes aceptar los términos y condiciones.', 'Términos') : alert('Debes aceptar los términos y condiciones.'));
        return;
      }

      const telefono = phoneRaw.startsWith('+') ? phoneRaw : ('+51 ' + phoneRaw);

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="">Guardando en la base de datos...</span>';
      }

      try {
        if (!window.Grassgo || typeof Grassgo.registerUser !== 'function') {
          throw new Error('Servicio de base de datos inicializando, intenta nuevamente.');
        }
        await Grassgo.registerUser({ nombre, email, password, telefono });
        if (window.GrassgoAlert) {
          GrassgoAlert.success('Tu cuenta fue creada correctamente. Redirigiendo...', '¡Bienvenido!');
        }
        setTimeout(function () {
          const target = window.location.pathname.endsWith('.html')
            ? window.location.pathname.replace(/[^/]+$/, 'canchas.html')
            : 'canchas.html';
          window.location.href = target;
        }, 900);
      } catch (err) {
        console.error(err);
        const msg = (err && err.message) ? err.message : 'Error al crear la cuenta. Inténtalo nuevamente.';
        if (window.GrassgoAlert) GrassgoAlert.error(msg, 'Registro');
        else alert(msg);
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalHtml;
        }
      }
    });
  });
</script>
